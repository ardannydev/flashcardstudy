<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Profil akun FlashCardStudy.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1426">
<title>Profil — FlashCardStudy</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">

  <header class="nh nh-nav-always">
    <div class="nh-inner">
      <div class="nh-bar">
        <a href="index.html" class="nh-logo">FlashCardStudy</a>
        <nav class="nh-nav-desktop">
          <div class="nh-skew-wrap">
            <a href="index.html" class="nh-link" draggable="false">Beranda</a>
            <a href="sets.html" class="nh-link" draggable="false">Set</a>
            <a href="create.html" class="nh-link" draggable="false">Buat</a>
            <span class="nh-nav-dot" id="navDot"></span>
          </div>
        </nav>
        <div class="nh-actions">
          <a href="profile.html" class="nh-profile-btn" draggable="false" aria-label="Profil" id="navProfileBtn">
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="profile-layout">
    <div class="profile-blobs" aria-hidden="true">
      <div class="profile-blob b1"></div>
      <div class="profile-blob b2"></div>
      <div class="profile-blob b3"></div>
      <div class="profile-blob b4"></div>
    </div>
    <div class="profile-banner"></div>
    <div class="profile-container">
      <div class="profile-header-card">
        <div class="profile-avatar-ring">
          <div class="profile-avatar" id="profileAvatar">
          </div>
        </div>
        <div class="profile-user-info">
          <h1 class="profile-name"><span id="profileNameText">—</span> <span id="devBadge" class="dev-badge" style="display:none">DEV</span></h1>
          <p class="profile-joined" id="profileJoined">Terdaftar: —</p>
        </div>
        <div class="profile-actions-top">
          <a href="admin" class="btn btn-outline" id="adminLink" style="display:none">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            Admin
          </a>
          <button class="btn btn-outline profile-logout" onclick="logout()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            Keluar
          </button>
        </div>
      </div>
      
      <div class="profile-dashboard">
        <div class="profile-section-title">Statistik Belajar</div>
        <div class="profile-stats-grid">
          <div class="p-stat-box p-stat-sets">
            <div class="p-stat-icon">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            </div>
            <div class="p-stat-info">
              <span class="p-stat-num" id="statSets">0</span>
              <span class="p-stat-label">Total Set</span>
            </div>
          </div>
          <div class="p-stat-box p-stat-cards">
            <div class="p-stat-icon">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
            </div>
            <div class="p-stat-info">
              <span class="p-stat-num" id="statCards">0</span>
              <span class="p-stat-label">Total Kartu</span>
            </div>
          </div>
          <div class="p-stat-box p-stat-mastered">
            <div class="p-stat-icon">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"></path></svg>
            </div>
            <div class="p-stat-info">
              <span class="p-stat-num" id="statMastered">0</span>
              <span class="p-stat-label">Kartu Dikuasai</span>
            </div>
          </div>
          <div class="p-stat-box p-stat-learning">
            <div class="p-stat-icon">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
            </div>
            <div class="p-stat-info">
              <span class="p-stat-num" id="statLearning">0</span>
              <span class="p-stat-label">Sedang Dipelajari</span>
            </div>
          </div>
        </div>
        
        <div class="profile-more-actions">
          <button class="btn btn-ghost" id="reportBtn" onclick="openReportForm()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            Laporkan Masalah
          </button>
        </div>
      </div>
    </div>
  </main>

  <div class="report-overlay" id="reportOverlay">
    <div class="report-card">
      <h3>Laporkan Masalah / Saran</h3>
      <select id="reportType" class="report-select">
        <option value="bug">Bug / Error</option>
        <option value="feature">Saran Fitur</option>
        <option value="other">Lainnya</option>
      </select>
      <textarea id="reportMessage" class="report-textarea" placeholder="Jelaskan masalah atau saran kamu..." rows="4"></textarea>
      <div class="report-actions">
        <button class="btn btn-ghost" onclick="closeReportForm()">Batal</button>
        <button class="btn btn-primary" onclick="submitReport()">Kirim</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
<script>
(async function(){
  if(!requireLogin()) return;
  await syncSetsFromServer();

  const username = getCurrentUser() || 'Pengguna';
  document.getElementById('profileNameText').textContent = username;
  const devBadge = document.getElementById('devBadge');
  if(isDevUser() && devBadge) devBadge.style.display = 'inline';

  try {
    const data = await getUserProfile();
    if(data && data.createdAt) {
      const d = new Date(data.createdAt);
      document.getElementById('profileJoined').textContent = 'Terdaftar: ' + d.toLocaleDateString('id-ID', { year:'numeric', month:'long', day:'numeric' });
    }
  } catch(e) { }

  const sets = getSets();
  let totalCards = 0, mastered = 0, learning = 0;

  sets.forEach(set => {
    if(set.terms) {
      set.terms.forEach(term => {
        totalCards++;
        const r = term._review;
        if(r && r.reps > 0){
          if(r.interval >= 21) mastered++;
          else learning++;
        }
      });
    }
  });

  document.getElementById('statSets').textContent = sets.length;
  document.getElementById('statCards').textContent = totalCards;
  document.getElementById('statMastered').textContent = mastered;
  document.getElementById('statLearning').textContent = learning;
  
  function renderAvatars(){
    const navBtn = document.getElementById('navProfileBtn');
    if(navBtn && typeof getUserAvatarUrl === 'function'){
      navBtn.innerHTML = `<img src="${getUserAvatarUrl()}" alt="Avatar">`;
    }
    const profileAvatar = document.getElementById('profileAvatar');
    if(profileAvatar && typeof getUserAvatarUrl === 'function'){
      profileAvatar.innerHTML = `<img src="${getUserAvatarUrl()}" alt="Avatar">`;
    }
  }
  renderAvatars();

  if(isDevUser()){
    const link = document.getElementById('adminLink');
    if(link) link.style.display = '';
  }
})();
</script>
<script>
function openReportForm(){
  document.getElementById('reportOverlay').classList.add('visible');
}
function closeReportForm(){
  document.getElementById('reportOverlay').classList.remove('visible');
}
function submitReport(){
  const type = document.getElementById('reportType').value;
  const message = document.getElementById('reportMessage').value.trim();
  if(!message){ createNotification('Pesan tidak boleh kosong.', 'error'); return; }
  addReport(type, message);
  document.getElementById('reportMessage').value = '';
  closeReportForm();
  createNotification('Laporan berhasil dikirim. Terima kasih!', 'success');
}
</script>
</body>
</html>
