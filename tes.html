<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>try{if((navigator.deviceMemory&&navigator.deviceMemory<=4&&navigator.hardwareConcurrency<=8)||matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('low-end')}catch(e){}</script>
<meta name="description" content="Tes Kotoba — buat tes gabungan dari bab mana pun dan tentukan jumlah soal di FlashCardStudy.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1426">
<title>Tes Kotoba — FlashCardStudy</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
<script>try{if(localStorage.getItem('fcsTheme')==='grey')document.body.classList.add('grey-theme')}catch(e){}</script>
  <header class="nh nh-nav-always">
    <div class="nh-inner">
      <div class="nh-bar">
        <a href="index.html" class="nh-logo">FlashCardStudy</a>
        <nav class="nh-nav-desktop">
          <div class="nh-skew-wrap">
            <a href="index.html" class="nh-link" draggable="false">Beranda</a>
            <a href="sets.html" class="nh-link" draggable="false">Set</a>
            <a href="tes.html" class="nh-link active" draggable="false">Tes</a>
            <a href="create.html" class="nh-link" draggable="false">Buat</a>
            <span class="nh-nav-dot" id="navDot"></span>
          </div>
        </nav>
        <div class="nh-actions">
          <a href="profile.html" class="nh-profile-btn" draggable="false" aria-label="Profil" id="navProfileBtn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="icontainer ts-main">
    <!-- Tahap 1: pilih bab -->
    <section class="ts-section" aria-labelledby="tsStep1Title">
      <div class="ts-section-head">
        <h2 class="ts-section-title" id="tsStep1Title">1 · Pilih Bab</h2>
        <div class="ts-quick">
          <button type="button" class="ts-chip ts-chip-quick" onclick="selectAllBabs()">Pilih semua bab</button>
          <button type="button" class="ts-chip ts-chip-quick" onclick="clearAll()">Bersihkan</button>
        </div>
      </div>
      <div class="ts-bab-grid" id="babGrid"></div>
    </section>

    <!-- Tahap 2: jumlah soal -->
    <section class="ts-section" aria-labelledby="tsStep2Title">
      <div class="ts-section-head">
        <h2 class="ts-section-title" id="tsStep2Title">2 · Jumlah Soal</h2>
      </div>
      <div class="ts-count-row">
        <div class="ts-count-chips" id="countChips"></div>
        <label class="ts-count-custom">
          <span class="ts-count-custom-label">Kustom</span>
          <input type="number" id="countInput" min="2" max="9999" inputmode="numeric" placeholder="cth: 50">
        </label>
      </div>
      <p class="ts-count-note" id="countNote"></p>
    </section>

    <!-- Ringkasan & mulai -->
    <div class="ts-actions">
      <div class="ts-summary" id="tsSummary">Belum ada bab dipilih.</div>
      <button type="button" class="btn btn-primary ts-start" id="startBtn" onclick="startTest()" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9V3z"></path></svg>
        Mulai Tes
      </button>
    </div>
  </main>

  <script src="app.js"></script>
<script>
(async function(){
  if(!requireLogin()) return;
  await syncSetsFromServer();

  const { groups, ungrouped } = groupAndSortSets(getSets());
  const selected = new Set();            // id set yang dipilih
  const allSets = [];                    // { set, groupName, groupKey }
  let chosenCount = 'all';               // 'all' | angka soal

  function collect(sets, groupName, groupKey){
    (sets || []).forEach(set => allSets.push({ set, groupName, groupKey }));
  }

  function setCountOf(set){ return (set.terms || []).length; }

  function groupKotoba(items){ return items.reduce((a, s) => a + setCountOf(s), 0); }

  function groupHue(name){
    if(/^[0-9.\-]+$/.test(name)){
      const h = parseInt(String(name).split(/[.\-]/)[0], 10) * 47;
      return Math.abs(h) % 360;
    }
    let h = 0;
    for(let i = 0; i < name.length; i++) h = (h + name.charCodeAt(i)) % 360;
    return h + 40;
  }

  function groupRange(g){
    if(g.minNum === null || g.minNum === undefined) return '';
    return g.minNum === g.maxNum ? String(g.minNum) : (g.minNum + '\u2013' + g.maxNum);
  }

  function groupInitial(name){
    const t = String(name || '').trim();
    return t.charAt(0).toUpperCase() || '?';
  }

  function renderGroups(){
    const grid = document.getElementById('babGrid');
    if(!groups.length && !ungrouped.length){
      grid.innerHTML = '<div class="ts-empty"><h3>Belum ada set</h3><p>Buat atau impor set dulu sebelum membuat tes.</p><a class="btn btn-primary" href="create.html" style="display:inline-block;margin-top:12px">Buat set</a></div>';
      return;
    }

    groups.forEach(g => {
      const hue = groupHue(g.name);
      const picked = g.items.length > 0 && g.items.every(s => selected.has(s.id));
      const el = document.createElement('article');
      el.className = 'ts-bab' + (picked ? ' picked' : '');
      el.dataset.grpKey = g.key;
      el.style.setProperty('--grp-h', hue);
      el.innerHTML =
        '<button type="button" class="ts-bab-head" data-grp="' + escapeHtml(g.key) + '">' +
          '<span class="ts-bab-icon"><span class="ts-bab-num">' + escapeHtml(groupRange(g) || groupInitial(g.name)) + '</span></span>' +
          '<span class="ts-bab-meta">' +
            '<strong>' + escapeHtml(g.name) + '</strong>' +
            '<small>' + g.items.length + ' set · ' + groupKotoba(g.items) + ' kotoba</small>' +
          '</span>' +
          '<span class="ts-bab-check"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>' +
        '</button>' +
        '<div class="ts-bab-list">' +
          g.items.map(s => {
            const n = s._group && s._group.number !== null ? s._group.number : s.title;
            return '<button type="button" class="ts-bab-item' + (selected.has(s.id) ? ' picked' : '') + '" data-set="' + escapeHtml(s.id) + '">' +
              '<span class="ts-bab-item-box"></span>' +
              '<span class="ts-bab-item-num">' + escapeHtml(n) + '</span>' +
              '<span class="ts-bab-item-count">' + setCountOf(s) + '</span>' +
            '</button>';
          }).join('') +
        '</div>';
      grid.appendChild(el);
    });

    if(ungrouped.length){
      const picked = ungrouped.every(s => selected.has(s.id));
      const el = document.createElement('article');
      el.className = 'ts-bab ts-bab-ungrouped' + (picked ? ' picked' : '');
      el.dataset.grpKey = '__ungrouped__';
      el.style.setProperty('--grp-h', 220);
      el.innerHTML =
        '<button type="button" class="ts-bab-head" data-grp="__ungrouped__">' +
          '<span class="ts-bab-icon"><span class="ts-bab-num">&#10047;</span></span>' +
          '<span class="ts-bab-meta">' +
            '<strong>Lainnya / Tanpa Bab</strong>' +
            '<small>' + ungrouped.length + ' set · ' + groupKotoba(ungrouped) + ' kotoba</small>' +
          '</span>' +
          '<span class="ts-bab-check"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>' +
        '</button>' +
        '<div class="ts-bab-list">' +
          ungrouped.map(s =>
            '<button type="button" class="ts-bab-item' + (selected.has(s.id) ? ' picked' : '') + '" data-set="' + escapeHtml(s.id) + '">' +
              '<span class="ts-bab-item-box"></span>' +
              '<span class="ts-bab-item-num">' + escapeHtml(s.title) + '</span>' +
              '<span class="ts-bab-item-count">' + setCountOf(s) + '</span>' +
            '</button>'
          ).join('') +
        '</div>';
      grid.appendChild(el);
    }
  }

  function poolSize(){
    return [...selected].reduce((a, id) => {
      const s = allSets.find(x => x.set.id === id);
      return a + (s ? setCountOf(s.set) : 0);
    }, 0);
  }

  function groupItemsByKey(key){
    if(key === '__ungrouped__') return ungrouped;
    const g = groups.find(x => x.key === key);
    return g ? g.items : [];
  }

  function syncCard(card){
    if(!card) return;
    const items = groupItemsByKey(card.getAttribute('data-grp-key'));
    const allPicked = items.length > 0 && items.every(s => selected.has(s.id));
    card.classList.toggle('picked', allPicked);
    card.querySelectorAll('.ts-bab-item').forEach(row => {
      row.classList.toggle('picked', selected.has(row.getAttribute('data-set')));
    });
  }

  function chosenN(){
    const pool = poolSize();
    if(chosenCount === 'all') return pool;
    return Math.max(2, Math.min(chosenCount, pool));
  }

  function updateSummary(){
    const pool = poolSize();
    const el = document.getElementById('tsSummary');
    const startBtn = document.getElementById('startBtn');
    const note = document.getElementById('countNote');

    if(selected.size === 0){
      el.textContent = 'Belum ada bab dipilih.';
      startBtn.disabled = true;
      note.textContent = '';
      return;
    }

    const babKeys = new Set(allSets.filter(x => selected.has(x.set.id)).map(x => x.groupKey)).size;
    const label = babKeys === 1 ? '1 bab' : babKeys + ' bab gabungan';
    el.textContent = selected.size + ' set terpilih (' + label + ') · ' + pool + ' kotoba.';
    startBtn.disabled = pool < 2;

    if(pool < 2){
      note.textContent = 'Perlu minimal 2 kotoba untuk memulai tes. Tambah pilihan bab.';
    } else {
      const n = chosenN();
      note.textContent = (n >= pool)
        ? 'Semua kotoba terpilih akan diuji (urutan acak).'
        : n + ' soal akan diambil acak dari ' + pool + ' kotoba.';
    }
  }

  function renderCountChips(){
    const chips = document.getElementById('countChips');
    chips.innerHTML = [10,20,30,50,100].map(n =>
      '<button type="button" class="ts-chip' + (chosenCount === n ? ' active' : '') + '" data-count="' + n + '" onclick="setCount(' + n + ')">' + n + ' soal</button>'
    ).join('') +
      '<button type="button" class="ts-chip' + (chosenCount === 'all' ? ' active' : '') + '" data-count="all" onclick="setCount(\'all\')">Semua soal</button>';
  }

  window.setCount = function(v){
    chosenCount = (v === 'all') ? 'all' : parseInt(v, 10) || 10;
    document.getElementById('countInput').value = '';
    renderCountChips();
    updateSummary();
  };

  window.selectAllBabs = function(){
    allSets.forEach(x => selected.add(x.set.id));
    renderGroups(); updateSummary();
  };

  window.clearAll = function(){
    selected.clear();
    renderGroups(); updateSummary();
  };

  window.startTest = function(){
    if(selected.size === 0){
      createNotification('Pilih minimal satu bab/set dulu.', 'error');
      return;
    }
    const pool = poolSize();
    if(pool < 2){
      createNotification('Perlu minimal 2 kotoba untuk memulai tes.', 'error');
      return;
    }
    const n = chosenN();
    const ids = [...selected];
    const label = 'Tes Kotoba';
    navigateTo('learn?ids=' + encodeURIComponent(ids.join(',')) + '&n=' + Math.min(n, pool) + '&t=' + encodeURIComponent(label));
  };

  // inisialisasi data
  groups.forEach(g => collect(g.items, g.name, g.key));
  collect(ungrouped, 'Lainnya / Tanpa Bab', '__ungrouped__');

  renderGroups();
  renderCountChips();
  updateSummary();

  // event wiring
  document.getElementById('babGrid').addEventListener('click', (e) => {
    const item = e.target.closest('.ts-bab-item');
    if(item){
      const id = item.getAttribute('data-set');
      if(selected.has(id)) selected.delete(id); else selected.add(id);
      syncCard(item.closest('.ts-bab'));
      updateSummary();
      return;
    }
    const head = e.target.closest('.ts-bab-head');
    if(head){
      const grp = head.getAttribute('data-grp');
      const items = groupItemsByKey(grp);
      const setIds = items.map(s => s.id);
      const isAll = setIds.length > 0 && setIds.every(id => selected.has(id));
      setIds.forEach(id => { if(isAll) selected.delete(id); else selected.add(id); });
      syncCard(head.closest('.ts-bab'));
      updateSummary();
      return;
    }
  });

  document.getElementById('countInput').addEventListener('input', () => {
    const v = parseInt(document.getElementById('countInput').value, 10);
    chosenCount = (isNaN(v) || v <= 0) ? 'all' : Math.max(2, v);
    renderCountChips();
    updateSummary();
  });
})();
</script>
</body>
</html>
