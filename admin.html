<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">

<title>Admin — FlashCardStudy</title>
<link rel="stylesheet" href="style.css">
<style>
/* ── Layout ── */
.adm-wrap{max-width:1000px;margin:0 auto;padding:16px 16px 48px}
.adm-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;padding:4px 0}
.adm-header-left{display:flex;align-items:center;gap:10px}
.adm-header-left h1{font-size:18px;font-weight:700;margin:0;letter-spacing:-.3px;background:linear-gradient(135deg,#fff 60%,rgba(255,255,255,.5));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.adm-badge{font-size:10px;font-weight:600;background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;padding:3px 12px 3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;border:1px solid rgba(245,158,11,.3)}
.adm-header-actions{display:flex;gap:6px}

/* ── Buttons ── */
.adm-btn{padding:7px 16px;font-size:12px;font-weight:500;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:rgba(255,255,255,.8);cursor:pointer;transition:all .15s;font-family:inherit;display:inline-flex;align-items:center;gap:6px;line-height:1}
.adm-btn:hover{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.15)}
.adm-btn-primary{border-color:rgba(59,130,246,.3);background:rgba(59,130,246,.1);color:#60a5fa}
.adm-btn-primary:hover{background:rgba(59,130,246,.2);border-color:rgba(59,130,246,.5)}
.adm-btn-success{border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.1);color:#4ade80}
.adm-btn-success:hover{background:rgba(34,197,94,.2);border-color:rgba(34,197,94,.5)}
.adm-btn-danger{border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.1);color:#f87171}
.adm-btn-danger:hover{background:rgba(239,68,68,.2);border-color:rgba(239,68,68,.5)}
.adm-btn-sm{padding:5px 12px;font-size:11px}
.adm-btn-icon{width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.adm-btn:disabled{opacity:.4;pointer-events:none}

/* ── Notice ── */
.adm-notice{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.12);border-radius:10px;padding:9px 14px;font-size:12px;color:#fbbf24;margin-bottom:20px;display:flex;align-items:center;gap:8px;line-height:1.4}
.adm-notice svg{flex-shrink:0}

/* ── Stats ── */
.adm-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:24px}
.adm-stat{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden;transition:border-color .2s}
.adm-stat:hover{border-color:rgba(255,255,255,.12)}
.adm-stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:14px 14px 0 0}
.adm-stat-blue::before{background:linear-gradient(90deg,#3b82f6,#60a5fa)}
.adm-stat-green::before{background:linear-gradient(90deg,#22c55e,#4ade80)}
.adm-stat-purple::before{background:linear-gradient(90deg,#a855f7,#c084fc)}
.adm-stat-orange::before{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.adm-stat-num{font-size:26px;font-weight:700;display:block;line-height:1.2;letter-spacing:-.5px}
.adm-stat-blue .adm-stat-num{color:#60a5fa}
.adm-stat-green .adm-stat-num{color:#4ade80}
.adm-stat-purple .adm-stat-num{color:#c084fc}
.adm-stat-orange .adm-stat-num{color:#fbbf24}
.adm-stat-label{font-size:10px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.6px;margin-top:3px;font-weight:500}
.adm-stat-sub{font-size:11px;color:rgba(255,255,255,.2);margin-top:1px;display:block}

/* ── Sections ── */
.adm-section{margin-bottom:24px}
.adm-section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.adm-section-hdr h2{font-size:14px;font-weight:600;margin:0;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:6px}
.adm-section-hdr h2 span{font-size:11px;font-weight:400;color:rgba(255,255,255,.25);background:rgba(255,255,255,.05);padding:1px 8px;border-radius:6px}
.adm-section-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.adm-search{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:6px 10px;color:#fff;font-size:12px;font-family:inherit;outline:none;width:150px;transition:all .15s}
.adm-search:focus{border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.07);width:180px}
.adm-search::placeholder{color:rgba(255,255,255,.18)}

.adm-filter{display:flex;gap:3px;background:rgba(255,255,255,.03);padding:3px;border-radius:8px;border:1px solid rgba(255,255,255,.04)}
.adm-filter-btn{padding:4px 10px;font-size:10px;font-weight:500;border-radius:6px;border:none;background:transparent;color:rgba(255,255,255,.3);cursor:pointer;transition:all .12s;font-family:inherit;letter-spacing:.2px}
.adm-filter-btn:hover{color:rgba(255,255,255,.6)}
.adm-filter-btn.active{background:rgba(255,255,255,.08);color:#fff}

/* ── Tables ── */
.adm-table-scroll{overflow-x:auto;border-radius:12px;border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.02)}
.adm-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:580px}
.adm-table th{text-align:left;padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.06);color:rgba(255,255,255,.3);font-weight:500;font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;background:rgba(0,0,0,.15);white-space:nowrap;position:sticky;top:0;z-index:1}
.adm-table td{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle;color:rgba(255,255,255,.75)}
.adm-table tbody tr{transition:background .1s}
.adm-table tbody tr:hover td{background:rgba(255,255,255,.03)}
.adm-table tbody tr:last-child td{border-bottom:none}

.adm-type{display:inline-block;font-size:9.5px;font-weight:600;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px}
.adm-type-bug{background:rgba(239,68,68,.12);color:#f87171}
.adm-type-feature{background:rgba(59,130,246,.12);color:#60a5fa}
.adm-type-other{background:rgba(168,85,247,.12);color:#c084fc}

.adm-status{display:inline-block;font-size:9.5px;font-weight:600;padding:2px 8px;border-radius:6px;text-transform:uppercase}
.adm-status-pending{background:rgba(245,158,11,.1);color:#fbbf24;position:relative}
.adm-status-pending::after{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:#fbbf24;margin-left:5px;animation:pulse-dot 1.5s ease-in-out infinite;vertical-align:middle}
.adm-status-resolved{background:rgba(34,197,94,.1);color:#4ade80}
@keyframes pulse-dot{0%,100%{opacity:.4}50%{opacity:1}}

.adm-msg{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default;display:block}
.adm-msg:hover{overflow:visible;white-space:normal;background:rgba(11,20,38,.96);padding:5px 8px;margin:-5px -8px;border-radius:5px;max-width:none;position:relative;z-index:2;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.adm-device{font-size:10.5px;color:rgba(255,255,255,.2);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.adm-ip{font-size:10.5px;color:rgba(255,255,255,.18)}
.adm-cell-actions{display:flex;gap:2px;opacity:.3;transition:opacity .15s}
tr:hover .adm-cell-actions{opacity:1}
.adm-cell-btn{background:none;border:none;color:rgba(255,255,255,.25);cursor:pointer;padding:3px;border-radius:5px;display:inline-flex;transition:all .12s;font-family:inherit;line-height:0}
.adm-cell-btn:hover{background:rgba(255,255,255,.06);color:#fff}
.adm-cell-btn.ok:hover{color:#4ade80}
.adm-cell-btn.del:hover{color:#f87171}

/* ── Empty / Loading ── */
.adm-empty{padding:48px 16px;text-align:center;color:rgba(255,255,255,.15);font-size:13px}
.adm-spinner{display:inline-block;width:20px;height:20px;border:2px solid rgba(255,255,255,.06);border-top-color:rgba(255,255,255,.3);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Users ── */
.adm-user-row{cursor:pointer}
.adm-user-expand td{padding:0!important;border-bottom:1px solid rgba(255,255,255,.04)}
.adm-user-expand-inner{padding:10px 12px 14px 28px;background:rgba(255,255,255,.01)}
.adm-user-expand-inner h4{font-size:11px;font-weight:600;margin:0 0 8px;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:.4px}
.adm-audit{display:flex;flex-direction:column;gap:3px}
.adm-audit-item{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.4);padding:2px 0}
.adm-audit-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.adm-audit-ok{background:#4ade80;box-shadow:0 0 6px rgba(74,222,128,.3)}
.adm-audit-fail{background:#f87171;box-shadow:0 0 6px rgba(248,113,113,.3)}
.adm-audit-ts{color:rgba(255,255,255,.2);font-size:11px;white-space:nowrap}

/* ── System Info ── */
.adm-sysinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.adm-sysinfo-item{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:10px;padding:11px 14px}
.adm-sysinfo-label{font-size:9.5px;text-transform:uppercase;color:rgba(255,255,255,.25);letter-spacing:.5px;margin-bottom:3px}
.adm-sysinfo-value{font-size:12.5px;font-weight:500;word-break:break-all;color:rgba(255,255,255,.7)}
.adm-sysinfo-value small{font-weight:400;color:rgba(255,255,255,.2)}

/* ── Toast ── */
.adm-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(11,20,38,.95);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 20px;font-size:13px;color:#fff;z-index:999;opacity:0;transition:all .25s cubic-bezier(.4,0,.2,1);pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px}
.adm-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.adm-toast-ok{border-color:rgba(34,197,94,.3)}
.adm-toast-ok::before{content:'';width:6px;height:6px;border-radius:50%;background:#4ade80;flex-shrink:0}
.adm-toast-err{border-color:rgba(239,68,68,.3)}
.adm-toast-err::before{content:'';width:6px;height:6px;border-radius:50%;background:#f87171;flex-shrink:0}

/* ── Responsive ── */
@media(max-width:700px){
  .adm-stats{grid-template-columns:repeat(2,1fr)}
  .adm-section-tools{flex-direction:column;align-items:stretch}
  .adm-search{width:auto}
  .adm-search:focus{width:auto}
  .adm-msg{max-width:130px}
}
@media(max-width:420px){
  .adm-stats{grid-template-columns:1fr}
  .adm-header{flex-direction:column;align-items:flex-start}
  .adm-header-actions{align-self:stretch}
  .adm-header-actions .adm-btn{flex:1;justify-content:center}
}
</style>

<script src="app.js"></script>
<script>
var _reports = [];
var _users = [];
var _reportFilter = 'all';
var _expandedUser = null;
var _serverAvail = false;

(async function(){
  if(!requireLogin()) return;

  renderStats();
  loadReports();
  loadUsers();
  renderSysInfo();

  document.getElementById('reportFilter').addEventListener('click', function(e){
    var btn = e.target.closest('.adm-filter-btn');
    if(!btn) return;
    document.querySelectorAll('#reportFilter .adm-filter-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    _reportFilter = btn.dataset.filter;
    renderReports();
  });

  document.getElementById('reportSearch').addEventListener('input', function(){ renderReports(); });
  document.getElementById('userSearch').addEventListener('input', function(){ renderUsers(); });
  document.getElementById('auditSearch').addEventListener('input', function(){ renderAudit(); });
})();

function refreshAll(){
  renderStats();
  loadReports();
  loadUsers();
  renderSysInfo();
}

function toast(msg, type){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'adm-toast show adm-toast-' + (type || 'ok');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('show'); }, 2500);
}

/* ── Stats ── */
function renderStats(){
  var sets = getSets();
  var totalSets = sets.length;
  var totalCards = sets.reduce(function(s,set){ return s + (set.terms||[]).length; }, 0);

  document.getElementById('statSets').textContent = totalSets;
  document.getElementById('statCards').textContent = totalCards;
  document.getElementById('statReportsSub').textContent = 'memuat...';

  fetch('/api/admin?action=stats', { headers: { 'Authorization': 'Bearer ' + getToken() } })
  .then(function(r){ if(!r.ok) throw new Error(); return r.json(); })
  .then(function(d){
    _serverAvail = true;
    document.getElementById('localNotice').style.display = 'none';
    if(d.users !== undefined) document.getElementById('statUsers').textContent = d.users;
    if(d.sets !== undefined) document.getElementById('statSets').textContent = d.sets;
    if(d.cards !== undefined) document.getElementById('statCards').textContent = d.cards;
    if(d.reports !== undefined){
      document.getElementById('statReports').textContent = d.reports;
      document.getElementById('statReportsSub').textContent = (d.pendingReports||0) + ' pending';
    }
    renderSysInfo();
  })
  .catch(function(){
    _serverAvail = false;
    document.getElementById('localNotice').style.display = '';
    document.getElementById('statUsers').textContent = '— (offline)';
    var localReports = getReports() || [];
    document.getElementById('statReports').textContent = localReports.length;
    document.getElementById('statReportsSub').textContent = localReports.filter(function(r){ return r.status==='pending'; }).length + ' pending (lokal)';
    document.getElementById('statSetsSub').textContent = totalCards + ' kartu';
    renderSysInfo();
  });
}

/* ── Reports ── */
function loadReports(){
  _reports = getReports() || [];
  renderReports();

  fetch('/api/admin?action=reports', { headers: { 'Authorization': 'Bearer ' + getToken() } })
  .then(function(r){ if(!r.ok) throw new Error(); return r.json(); })
  .then(function(data){
    if(data.reports && data.reports.length){
      var m = data.reports.slice();
      _reports.forEach(function(r){ if(!m.find(function(x){ return x.id === r.id; })) m.push(r); });
      _reports = m;
    }
    renderReports();
  }).catch(function(){});
}

function renderReports(){
  var wrap = document.getElementById('reportsWrap');
  var search = (document.getElementById('reportSearch').value || '').toLowerCase();
  var filtered = _reports.filter(function(r){
    if(_reportFilter !== 'all' && _reportFilter !== 'pending' && _reportFilter !== 'resolved'){
      if((r.type||'other') !== _reportFilter) return false;
    }
    if(_reportFilter === 'pending' && r.status !== 'pending') return false;
    if(_reportFilter === 'resolved' && r.status !== 'resolved') return false;
    if(search && (r.message||'').toLowerCase().indexOf(search) === -1 && (r.username||'').toLowerCase().indexOf(search) === -1) return false;
    return true;
  });

  document.getElementById('reportCountLabel').textContent = filtered.length;

  if(filtered.length === 0){
    wrap.innerHTML = '<div class="adm-empty">Tidak ada laporan.</div>';
    return;
  }

  var html = '<table class="adm-table"><thead><tr><th>Tipe</th><th>Pesan</th><th>Pengguna</th><th>Device / IP</th><th>Status</th><th>Tanggal</th><th></th></tr></thead><tbody>';
  filtered.slice(0, 200).forEach(function(r){
    var date = r.date ? new Date(r.date).toLocaleDateString('id-ID',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
    var tc = 'adm-type adm-type-' + (r.type||'other');
    var tl = r.type === 'bug' ? 'Bug' : r.type === 'feature' ? 'Saran' : 'Lain';
    var sc = 'adm-status adm-status-' + (r.status||'pending');
    var sl = r.status === 'resolved' ? 'Selesai' : 'Pending';
    var device = (r.device||'').slice(0,100) || '—';
    var ip = r.ip || '';
    var rid = escapeHtml(r.id);
    html += '<tr><td><span class="'+tc+'">'+tl+'</span></td>';
    html += '<td><span class="adm-msg" title="'+escapeHtml(r.message)+'">'+escapeHtml(r.message)+'</span></td>';
    html += '<td>'+escapeHtml(r.username||r.userId||'—')+'</td>';
    html += '<td><span class="adm-device" title="'+escapeHtml(device)+'">'+escapeHtml(device)+'</span>'+(ip?'<span class="adm-ip">'+escapeHtml(ip)+'</span>':'')+'</td>';
    html += '<td><span class="'+sc+'">'+sl+'</span></td>';
    html += '<td style="white-space:nowrap;font-size:11px;color:rgba(255,255,255,.25)">'+date+'</td>';
    html += '<td><div class="adm-cell-actions">';
    if(r.status !== 'resolved'){
      html += '<button class="adm-cell-btn ok" onclick="resolveReport(\''+rid+'\')" title="Tandai selesai"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>';
    }
    html += '<button class="adm-cell-btn del" onclick="deleteReport(\''+rid+'\')" title="Hapus"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>';
    html += '</div></td></tr>';
  });
  html += '</tbody></table>';
  if(filtered.length > 200) html += '<p style="text-align:center;padding:8px;font-size:11px;color:rgba(255,255,255,.15)">Menampilkan 200 dari '+filtered.length+' laporan</p>';
  wrap.innerHTML = html;
}

function resolveReport(id){
  var r = _reports.find(function(x){ return x.id === id; });
  if(!r) return;
  r.status = 'resolved';
  fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()},body:JSON.stringify({action:'resolveReport',reportId:id})}).catch(function(){});
  renderReports();
  renderStats();
  toast('Laporan ditandai selesai');
}

function deleteReport(id){
  _reports = _reports.filter(function(r){ return r.id !== id; });
  fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()},body:JSON.stringify({action:'deleteReport',reportId:id})}).catch(function(){});
  renderReports();
  renderStats();
  toast('Laporan dihapus');
}

/* ── Users ── */
function loadUsers(){
  document.getElementById('usersWrap').innerHTML = '<div class="adm-empty"><div class="adm-spinner"></div></div>';
  fetch('/api/admin?action=users',{headers:{'Authorization':'Bearer '+getToken()}})
  .then(function(r){ if(!r.ok) throw new Error(); return r.json(); })
  .then(function(data){
    _users = data.users || [];
    renderUsers();
  }).catch(function(){
    document.getElementById('usersWrap').innerHTML = '<div class="adm-empty">Tidak dapat terhubung ke server. Data pengguna tidak tersedia.</div>';
    document.getElementById('userCountLabel').textContent = '—';
  });
}

function renderUsers(){
  var wrap = document.getElementById('usersWrap');
  var search = (document.getElementById('userSearch').value||'').toLowerCase();
  var filtered = search ? _users.filter(function(u){ return u.username.toLowerCase().indexOf(search) !== -1; }) : _users;
  document.getElementById('userCountLabel').textContent = filtered.length;

  if(filtered.length === 0){
    wrap.innerHTML = '<div class="adm-empty">Tidak ada pengguna.</div>';
    return;
  }

  var html = '<table class="adm-table"><thead><tr><th>Username</th><th>Set</th><th>Kartu</th><th>Terdaftar</th><th>Login Terakhir</th><th>IP</th></tr></thead><tbody>';
  filtered.forEach(function(u){
    var created = u.createdAt ? new Date(u.createdAt).toLocaleDateString('id-ID',{year:'numeric',month:'short',day:'numeric'}) : '—';
    var last = u.lastLogin ? new Date(u.lastLogin).toLocaleDateString('id-ID',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
    var ex = _expandedUser === u.username;
    var un = escapeHtml(u.username);
    html += '<tr class="adm-user-row" onclick="toggleUser(\''+un+'\')"><td><strong>'+un+'</strong></td>';
    html += '<td>'+ (u.setCount||0) +'</td><td>'+ (u.cardCount||0) +'</td>';
    html += '<td style="font-size:11px;color:rgba(255,255,255,.3)">'+created+'</td>';
    html += '<td style="font-size:11px;color:rgba(255,255,255,.3)">'+last+'</td>';
    html += '<td style="font-size:11px;color:rgba(255,255,255,.3)">'+ (u.lastIp||'—') +'</td></tr>';
    if(ex){
      html += '<tr class="adm-user-expand"><td colspan="6"><div class="adm-user-expand-inner">';
      if(u.audit && u.audit.length){
        html += '<h4>Aktivitas Login</h4><div class="adm-audit">';
        u.audit.forEach(function(a){
          var ts = a.ts ? new Date(a.ts).toLocaleDateString('id-ID',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
          html += '<div class="adm-audit-item"><span class="adm-audit-dot '+(a.type==='login_ok'?'adm-audit-ok':'adm-audit-fail')+'"></span>';
          html += '<span>'+(a.type==='login_ok'?'Berhasil':'Gagal')+'</span>';
          html += '<span class="adm-audit-ts">'+ts+'</span>';
          html += '<span style="color:rgba(255,255,255,.2);font-size:10.5px">'+(a.ip||'—')+'</span></div>';
        });
        html += '</div>';
      } else {
        html += '<p style="color:rgba(255,255,255,.15);font-size:12px;margin:0">Tidak ada data audit.</p>';
      }
      html += '</div></td></tr>';
    }
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

function toggleUser(username){
  _expandedUser = _expandedUser === username ? null : username;
  renderUsers();
}

/* ── Audit ── */
function loadAudit(){
  var wrap = document.getElementById('auditWrap');
  wrap.innerHTML = '<div class="adm-empty"><div class="adm-spinner"></div></div>';
  fetch('/api/admin?action=audit',{headers:{'Authorization':'Bearer '+getToken()}})
  .then(function(r){ if(!r.ok) throw new Error(); return r.json(); })
  .then(function(data){
    window._auditEntries = data.entries || [];
    renderAudit();
  }).catch(function(){ wrap.innerHTML = '<div class="adm-empty">Data audit tidak tersedia.</div>'; });
}

function renderAudit(){
  var wrap = document.getElementById('auditWrap');
  var entries = window._auditEntries || [];
  var search = (document.getElementById('auditSearch').value||'').toLowerCase();
  if(entries.length === 0){ wrap.innerHTML = '<div class="adm-empty">Tidak ada data audit.</div>'; return; }
  var filtered = search ? entries.filter(function(e){ return (e.user||'').toLowerCase().indexOf(search)!==-1||(e.ip||'').toLowerCase().indexOf(search)!==-1; }) : entries;

  var html = '<table class="adm-table"><thead><tr><th>User</th><th>Status</th><th>IP</th><th>Waktu</th></tr></thead><tbody>';
  filtered.slice(0,150).forEach(function(e){
    var ts = e.ts ? new Date(e.ts).toLocaleDateString('id-ID',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
    var ok = e.type === 'login_ok';
    html += '<tr><td>'+escapeHtml(e.user||'—')+'</td>';
    html += '<td><span class="'+(ok?'adm-status adm-status-resolved':'adm-status adm-status-pending')+'">'+(ok?'Berhasil':'Gagal')+'</span></td>';
    html += '<td style="font-size:11px;color:rgba(255,255,255,.3)">'+escapeHtml(e.ip||'—')+'</td>';
    html += '<td style="font-size:11px;color:rgba(255,255,255,.25);white-space:nowrap">'+ts+'</td></tr>';
  });
  html += '</tbody></table>';
  if(filtered.length > 150) html += '<p style="text-align:center;padding:8px;font-size:11px;color:rgba(255,255,255,.15)">Menampilkan 150 dari '+filtered.length+' entri</p>';
  wrap.innerHTML = html;
}

/* ── System Info ── */
function renderSysInfo(){
  var wrap = document.getElementById('sysInfo');
  var mode = _serverAvail ? 'Server (Vercel KV)' : 'Lokal (localStorage)';
  var storage = 0;
  try{ storage = new Blob([localStorage.getItem('qz_sets_v1')||'']).size + new Blob([localStorage.getItem('qz_reports')||'']).size; }catch(e){}
  var storageStr = storage > 1024 ? (storage/1024).toFixed(1)+' KB' : storage+' B';
  var now = new Date().toLocaleString('id-ID');
  wrap.innerHTML =
    '<div class="adm-sysinfo-item"><div class="adm-sysinfo-label">Mode</div><div class="adm-sysinfo-value">'+mode+'</div></div>'+
    '<div class="adm-sysinfo-item"><div class="adm-sysinfo-label">Penyimpanan Lokal</div><div class="adm-sysinfo-value">'+storageStr+'</div></div>'+
    '<div class="adm-sysinfo-item"><div class="adm-sysinfo-label">User Saat Ini</div><div class="adm-sysinfo-value">'+escapeHtml(getCurrentUser()||'—')+'</div></div>'+
    '<div class="adm-sysinfo-item"><div class="adm-sysinfo-label">Terakhir Segarkan</div><div class="adm-sysinfo-value"><small>'+now+'</small></div></div>';
}

function exportReports(){
  var data = JSON.stringify(_reports,null,2);
  var blob = new Blob([data],{type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'laporan_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Laporan diekspor');
}
</script>
