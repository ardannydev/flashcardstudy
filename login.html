<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Masuk atau daftar akun FlashCardStudy untuk menyimpan flashcard kamu.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e0b2e">
<title>Masuk — FlashCardStudy</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme login-page">

<main class="auth-wrap" role="main">

  <div class="auth-card" role="region" aria-label="Formulir autentikasi">
    <div id="authError" class="auth-error" role="alert" aria-live="polite"></div>

    <!-- Form Masuk -->
    <form id="loginForm">
      <h1 class="auth-title">Masuk ke akun kamu</h1>
      <p class="auth-sub">Semua set flashcard kamu tersimpan aman di akunmu.</p>

      <div class="auth-field">
        <label for="loginUsername">Username</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <input id="loginUsername" type="text" autocomplete="username" placeholder="Masukkan username" required spellcheck="false" aria-describedby="loginUsernameHint">
        </div>
      </div>

      <div class="auth-field">
        <label for="loginPassword">Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm0-12c-1.66 0-3 1.34-3 3v2h6V6c0-1.66-1.34-3-3-3z"/></svg>
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Masukkan password" required aria-describedby="loginPasswordHint">
          <button type="button" class="toggle-password" aria-label="Tampilkan sembunyikan password" aria-pressed="false">
            <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5C21.27 7.61 17 4.5 12 4.5zm0 1.5c3.03 0 5.5 1.38 7.5 3.5C19.5 13.12 17.03 14.5 12 14.5S4.5 13.12 2.5 9.5 7 4.5 12 4.5z"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>
          </button>
        </div>
      </div>

      <div class="auth-options">
        <label class="checkbox-wrapper">
          <input type="checkbox" id="rememberMe" name="rememberMe">
          <span class="checkbox-custom" aria-hidden="true"></span>
          <span class="checkbox-label">Ingat saya</span>
        </label>
        <a href="#" class="forgot-link" id="forgotPassword">Lupa password?</a>
      </div>

      <button type="submit" class="auth-submit" id="loginBtn">
        <span class="btn-text">Masuk</span>
        <span class="btn-loader" aria-hidden="true">
          <svg class="spinner" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4 31.4" stroke-linecap="round"/></svg>
        </span>
      </button>
    </form>

    <div class="auth-footer">
      <p class="auth-footer-text">Belum punya akun? Hubungi admin untuk pendaftaran.</p>
    </div>
  </div>
</main>

<div class="bg-glow" aria-hidden="true"></div>
<div class="bg-glow secondary" aria-hidden="true"></div>

<script src="app.js"></script>
<script>
// Redirect if already logged in
if(getToken()){
  if(isDevUser()){
    navigateTo('admin', { replace: true });
  } else {
    navigateTo('index', { replace: true });
  }
}

const loginForm = document.getElementById('loginForm');
const authError = document.getElementById('authError');
const forgotPassword = document.getElementById('forgotPassword');

function clearError(){
  authError.classList.remove('show');
  authError.textContent = '';
}

function showError(msg){
  authError.textContent = msg;
  authError.classList.add('show');
  authError.focus();
}

function clearError(){
  authError.classList.remove('show');
  authError.textContent = '';
}

// Password toggle functionality
document.querySelectorAll('.toggle-password').forEach(btn => {
  btn.addEventListener('click', () => {
    const wrapper = btn.closest('.input-wrapper');
    const input = wrapper.querySelector('input');
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    btn.setAttribute('aria-pressed', isPassword);
    input.focus();
  });
});

// Forgot password handler
forgotPassword.addEventListener('click', (e) => {
  e.preventDefault();
  showError('Fitur lupa password akan segera hadir. Hubungi admin jika butuh bantuan.');
});

// Form submissions
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();
  
  const btn = document.getElementById('loginBtn');
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const remember = document.getElementById('rememberMe').checked;
  
  if(!username || !password){ 
    showError('Username dan password wajib diisi.'); 
    return; 
  }

  btn.disabled = true;
  btn.classList.add('loading');
  
  // Dev account shortcut
  if(username === 'devardwannyy' && password === 'devardwannyy'){
    if(isLocalMode()){
      setAuth('dev_token', username, remember);
      setDevUser(true);
      navigateTo('admin');
      btn.disabled = false;
      btn.classList.remove('loading');
      return;
    }
    try{
      let res = await fetch('/api/login', { 
        method:'POST', 
        headers:{'Content-Type':'application/json'}, 
        body:JSON.stringify({username,password}) 
      });
      if(!res.ok){
        res = await fetch('/api/register', { 
          method:'POST', 
          headers:{'Content-Type':'application/json'}, 
          body:JSON.stringify({username,password}) 
        });
        if(!res.ok){ 
          showError('Gagal daftar. Coba langsung di Vercel.'); 
          btn.disabled=false; 
          btn.classList.remove('loading'); 
          return; 
        }
      }
      const data = await res.json();
      setAuth(data.token, data.username, remember);
      setDevUser(true);
      await syncSetsFromServer();
      navigateTo('admin');
    }catch(err){ 
      showError('Tidak bisa terhubung ke server.'); 
    }finally{ 
      btn.disabled = false; 
      btn.classList.remove('loading'); 
    }
    return;
  }

  if(isLocalMode()){
    setAuth('local_dev_token', username, remember);
    navigateTo('index');
    btn.disabled = false;
    btn.classList.remove('loading');
    return;
  }

  try{
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if(!res.ok){ 
      showError(data.error || 'Gagal masuk.'); 
      return; 
    }
    setAuth(data.token, data.username, remember);
    await syncSetsFromServer();
    navigateTo('index');
  }catch(err){
    showError('Tidak bisa terhubung ke server. Coba lagi.');
  }finally{
    btn.disabled = false;
    btn.classList.remove('loading');
  }
});

// Keyboard accessibility
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    clearError();
  }
});
</script>
</body>
</html>
