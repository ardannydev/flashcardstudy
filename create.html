<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Buat atau edit set flashcard baru di FlashCardStudy.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1426">
<title>Buat Set — FlashCardStudy</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">

  <header class="nh nh-nav-always">
    <div class="nh-inner">
      <div class="nh-bar">
        <a href="index.html" class="nh-logo">FlashCardStudy</a>
        <nav class="nh-nav-desktop">
          <div class="nh-skew-wrap">
            <a href="index.html" class="nh-link" draggable="false">Beranda</a>
            <a href="sets.html" class="nh-link" draggable="false">Set</a>
            <a href="create.html" class="nh-link active" draggable="false" id="leaveBtn">Buat</a>
            <span class="nh-nav-dot" id="navDot"></span>
          </div>
        </nav>
        <div class="nh-actions">
          <a href="profile.html" class="nh-profile-btn" draggable="false" aria-label="Profil" id="navProfileBtn">
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="cwrap">
    <div class="cfixed-head">
      <input aria-label="Judul set" class="cfield-box" id="title" placeholder="Judul set" autocomplete="off">

      <div class="cmeta-row">
        <textarea aria-label="Deskripsi set" class="cfield-box cdesc-box" id="desc" placeholder="Tambahkan deskripsi..." rows="1"></textarea>
      </div>

      <div class="ctoolbar">
        <div class="ctoolbar-left">
          <span class="ccount" id="cardCount">0 kartu</span>
          <button type="button" class="ibtn ibtn-outline" id="pdfToggle" aria-expanded="false" aria-controls="pdfBox">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>
            PDF
          </button>
        </div>
        <div class="ctoolbar-right">
          <button type="button" class="ibtn ibtn-outline" id="importToggle" aria-expanded="false" aria-controls="importBox">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Import
          </button>
          <button type="button" class="ibtn ibtn-primary" onclick="handleSave(false)">Simpan</button>
          <button type="button" class="ibtn ibtn-ghost" onclick="handleSave(true)" title="Simpan & lanjut belajar">Simpan & Belajar</button>
        </div>
      </div>

      <div class="cimport-box" id="importBox">
        <div class="cimport-grid">
          <textarea id="bulkText" placeholder="こうきょう → publik&#10;しせつ → fasilitas&#10;としょかん → perpustakaan"></textarea>
          <button class="cbtn cbtn-primary" onclick="parseBulk()">Proses</button>
        </div>
      </div>

      <div class="cimport-box cpdf-box" id="pdfBox">
        <div class="cpdf-drop" id="pdfDrop">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>
          <p class="cpdf-drop-title">Lampirkan file PDF</p>
          <p class="cpdf-drop-sub">File akan dibaca langsung di dalam website (maks 3 MB).</p>
          <input type="file" id="pdfFileInput" accept="application/pdf,.pdf" hidden>
          <button type="button" class="cbtn cbtn-primary" id="pdfPickBtn">Pilih PDF</button>
        </div>
        <div class="cpdf-attach" id="pdfAttach" style="display:none">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ff6b6b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>
          <div class="cpdf-attach-meta">
            <span class="cpdf-attach-name" id="pdfAttachName"></span>
            <span class="cpdf-attach-size" id="pdfAttachSize"></span>
          </div>
          <button type="button" class="cpdf-remove" id="pdfRemoveBtn" aria-label="Hapus PDF">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="cscroll">
      <div id="rows"></div>
      <div class="caddcard-wrap">
        <button type="button" class="caddcard-btn" onclick="addRow()" aria-label="Tambahkan kartu">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Tambahkan kartu
        </button>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
<script>
(function(){
let rows = [];
let editingId = qs('id');
let _saving = false;
let _deletedStack = [];

function addRow(term='', def=''){
  rows.push({id: uid('row'), term, def});
  renderRows();
  setTimeout(() => {
    const el = document.querySelector('.crow:last-child .cfield-term');
    if(el) el.focus();
  }, 50);
}

function removeRow(rid){
  const idx = rows.findIndex(r => r.id === rid);
  if(idx === -1) return;
  const removed = rows.splice(idx, 1)[0];
  _deletedStack.push(removed);
  renderRows();
  const note = createNotification('Kartu dihapus.', 'info', 4000);
  const undoBtn = document.createElement('button');
  undoBtn.textContent = 'Urungkan';
  undoBtn.className = 'notif-undo';
  undoBtn.onclick = () => {
    rows.splice(idx, 0, _deletedStack.pop());
    renderRows();
    if(note.parentNode) note.remove();
  };
  note.appendChild(undoBtn);
  updateCardCount();
}

function updateCardCount(){
  const el = document.getElementById('cardCount');
  if(el) el.textContent = rows.filter(r => r.term.trim() || r.def.trim()).length + ' kartu';
}

function renderRows(){
  const wrap = document.getElementById('rows');
  if(rows.length === 0){
    wrap.innerHTML = '';
    updateCardCount();
    return;
  }
  wrap.innerHTML = rows.map((r,i) => {
    const rid = escapeHtml(r.id);
    return `
    <div class="crow" data-row-id="${rid}">
      <div class="crow-head">
        <span class="crow-handle"
          ontouchstart="onTouchStart(event,'${rid}')"
          onmousedown="onMouseDownStart(event,'${rid}')">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="5" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="19" r="1"/></svg>
        </span>
        <span class="crow-num">${i+1}</span>
      </div>
      <div class="crow-body">
        <div class="cinput-group">
          <input class="cfield-term" aria-label="Istilah ${i+1}" placeholder="Istilah" value="${escapeHtml(r.term)}"
            oninput="onFieldInput('${rid}','term',this.value)"
            onkeydown="onFieldKeydown(event,'${rid}')">
        </div>
        <div class="cinput-group">
          <input class="cfield-def" aria-label="Definisi ${i+1}" placeholder="Definisi" value="${escapeHtml(r.def)}"
            oninput="onFieldInput('${rid}','def',this.value)"
            onkeydown="onFieldKeydown(event,'${rid}')">
        </div>
      </div>
      <button type="button" class="crow-del" onclick="removeRow('${rid}')" aria-label="Hapus kartu ${i+1}" title="Hapus">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>`;
  }).join('');
  updateCardCount();
}

function onFieldInput(rid, field, val){
  const r = rows.find(x => x.id === rid);
  if(r) r[field] = val;
  updateCardCount();
}

function onFieldKeydown(e, rid){
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    const idx = rows.findIndex(r => r.id === rid);
    if(idx === rows.length - 1){
      addRow();
    } else {
      const next = document.querySelector(`.crow[data-row-id="${escapeHtml(rows[idx+1].id)}"] .cfield-term`);
      if(next) next.focus();
    }
  }
  if(e.key === 'Tab' && !e.shiftKey){
    const idx = rows.findIndex(r => r.id === rid);
    if(idx === rows.length - 1){
      const field = e.target.classList.contains('cfield-def') ? 'term' : 'def';
      if(field === 'def'){
        e.preventDefault();
        addRow();
      }
    }
  }
}

/* ---- Mouse drag-and-drop reorder ---- */
let _dd = { active: false, rowId: null, startIdx: -1, currentOverIdx: -1 };

function onMouseDownStart(e, rid){
  if(e.button !== 0) return;
  _dd.active = true;
  _dd.rowId = rid;
  _dd.startIdx = rows.findIndex(r => r.id === rid);
  _dd.currentOverIdx = _dd.startIdx;
  document.querySelector(`.crow[data-row-id="${rid}"]`).classList.add('dragging');
  document.addEventListener('mousemove', onMouseMoveDrag);
  document.addEventListener('mouseup', onMouseUpDrag);
  e.preventDefault();
}

function onMouseMoveDrag(e){
  if(!_dd.active) return;
  const rowsEls = document.querySelectorAll('.crow');
  rowsEls.forEach(el => el.classList.remove('drag-over'));
  let overIdx = _dd.startIdx;
  rowsEls.forEach((el, i) => {
    const rect = el.getBoundingClientRect();
    if(e.clientY > rect.top && e.clientY < rect.bottom){
      overIdx = i;
      if(i !== _dd.startIdx && el.dataset.rowId !== _dd.rowId) el.classList.add('drag-over');
    }
  });
  _dd.currentOverIdx = overIdx;
}

function onMouseUpDrag(){
  if(!_dd.active) return;
  _dd.active = false;
  document.querySelectorAll('.crow').forEach(el => {
    el.classList.remove('dragging');
    el.classList.remove('drag-over');
  });
  if(_dd.startIdx !== _dd.currentOverIdx && _dd.startIdx >= 0 && _dd.currentOverIdx >= 0){
    const [moved] = rows.splice(_dd.startIdx, 1);
    rows.splice(_dd.currentOverIdx, 0, moved);
    renderRows();
  }
  document.removeEventListener('mousemove', onMouseMoveDrag);
  document.removeEventListener('mouseup', onMouseUpDrag);
}

/* ---- Touch drag-and-drop ---- */
let touchDrag = { active: false, rowId: null, clone: null, startY: 0, startIdx: -1, currentOverIdx: -1 };

function onTouchStart(e, rid){
  const touch = e.touches[0];
  const row = e.currentTarget.closest('.crow');
  if(!row) return;
  const rect = row.getBoundingClientRect();
  touchDrag.active = true;
  touchDrag.rowId = rid;
  touchDrag.startY = touch.clientY;
  touchDrag.startIdx = rows.findIndex(r => r.id === rid);
  touchDrag.currentOverIdx = touchDrag.startIdx;
  const clone = row.cloneNode(true);
  clone.classList.add('crow-drag-clone');
  clone.style.position = 'fixed';
  clone.style.left = rect.left + 'px';
  clone.style.top = rect.top + 'px';
  clone.style.width = rect.width + 'px';
  clone.style.zIndex = '9999';
  clone.style.pointerEvents = 'none';
  clone.style.opacity = '0.92';
  clone.style.transform = 'scale(1.03)';
  document.body.appendChild(clone);
  touchDrag.clone = clone;
  row.classList.add('dragging');
}

function onTouchMove(e){
  if(!touchDrag.active) return;
  const touch = e.touches[0];
  const dy = touch.clientY - touchDrag.startY;
  if(touchDrag.clone){
    const row = document.querySelector(`.crow[data-row-id="${touchDrag.rowId}"]`);
    if(row) touchDrag.clone.style.top = (row.getBoundingClientRect().top + dy) + 'px';
  }
  document.querySelectorAll('.crow').forEach(el => el.classList.remove('drag-over'));
  let overIdx = touchDrag.startIdx;
  document.querySelectorAll('.crow').forEach((el, i) => {
    const rect = el.getBoundingClientRect();
    if(touch.clientY > rect.top && touch.clientY < rect.bottom){
      overIdx = i;
      if(i !== touchDrag.startIdx) el.classList.add('drag-over');
    }
  });
  touchDrag.currentOverIdx = overIdx;
  e.preventDefault();
}

function onTouchEnd(){
  if(!touchDrag.active) return;
  touchDrag.active = false;
  if(touchDrag.clone) touchDrag.clone.remove();
  document.querySelectorAll('.crow').forEach(el => {
    el.classList.remove('dragging');
    el.classList.remove('drag-over');
  });
  if(touchDrag.startIdx !== touchDrag.currentOverIdx && touchDrag.startIdx >= 0 && touchDrag.currentOverIdx >= 0){
    const [moved] = rows.splice(touchDrag.startIdx, 1);
    rows.splice(touchDrag.currentOverIdx, 0, moved);
    renderRows();
  }
  touchDrag.rowId = null;
  touchDrag.clone = null;
  touchDrag.startIdx = -1;
  touchDrag.currentOverIdx = -1;
}

document.addEventListener('touchmove', onTouchMove, {passive:false});
document.addEventListener('touchend', onTouchEnd);

// Auto-resize textarea
document.getElementById('desc').addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.max(56, this.scrollHeight) + 'px';
});

const importToggle = document.getElementById('importToggle');
importToggle.addEventListener('click', () => {
  const box = document.getElementById('importBox');
  const open = box.classList.toggle('open');
  importToggle.setAttribute('aria-expanded', String(open));
});

/* ---- PDF attachment ---- */
let _pdfFile = null;

function formatFileSize(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function renderPdfAttach(){
  const drop = document.getElementById('pdfDrop');
  const attach = document.getElementById('pdfAttach');
  if(_pdfFile){
    drop.style.display = 'none';
    attach.style.display = 'flex';
    document.getElementById('pdfAttachName').textContent = _pdfFile.name;
    document.getElementById('pdfAttachSize').textContent = formatFileSize(_pdfFile.size);
  } else {
    drop.style.display = '';
    attach.style.display = 'none';
  }
}

function openPdfPicker(){
  document.getElementById('pdfFileInput').click();
}

document.getElementById('pdfToggle').addEventListener('click', () => {
  const box = document.getElementById('pdfBox');
  const open = box.classList.toggle('open');
  document.getElementById('pdfToggle').setAttribute('aria-expanded', String(open));
});
document.getElementById('pdfPickBtn').addEventListener('click', openPdfPicker);

document.getElementById('pdfFileInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  if(file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name)){
    createNotification('Hanya file PDF yang bisa dilampirkan.', 'error');
    e.target.value = '';
    return;
  }
  if(file.size > 3 * 1024 * 1024){
    createNotification('File terlalu besar (maks 3 MB).', 'error');
    e.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    _pdfFile = { name: file.name, size: file.size, data: reader.result.split(',')[1] };
    renderPdfAttach();
    createNotification('PDF dilampirkan.', 'success');
  };
  reader.readAsDataURL(file);
});

document.getElementById('pdfRemoveBtn').addEventListener('click', () => {
  _pdfFile = null;
  document.getElementById('pdfFileInput').value = '';
  renderPdfAttach();
});

const HAS_JP = /[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF]/;
const JP_ONLY = /[^\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF\u3005\u3006\u3007\u3031-\u303B\u30FC\u30FB\u3001\u3002\s]/g;
const PARENS = /\s*[（(][^）)]*[）)]\s*/g;

function cleanTerm(raw){
  return raw.replace(PARENS, ' ').replace(JP_ONLY, '').replace(/\s+/g, ' ').trim();
}

function parseCSV(text){
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const parsed = [];
  const failedLines = [];
  lines.forEach(line => {
    const idx = line.indexOf('→');
    if(idx === -1){ failedLines.push(line); return; }
    const rawTerm = line.slice(0, idx).trim();
    const def = line.slice(idx + 1).trim();
    if(!rawTerm || !def){ failedLines.push(line); return; }
    const term = cleanTerm(rawTerm);
    if(!term || !HAS_JP.test(term)){ failedLines.push(line); return; }
    parsed.push({id: uid('row'), term, def: def.replace(/\s+/g, ' ').trim()});
  });
  return { parsed, failedLines };
}

function parseBulk(){
  const raw = document.getElementById('bulkText').value;
  const { parsed, failedLines } = parseCSV(raw);
  if(parsed.length === 0){
    createNotification('Tidak ada baris yang berhasil dibaca. Pastikan tiap baris berformat "kotoba → arti"', 'error');
    return;
  }
  const valid = [];
  const skipped = [];
  parsed.forEach(p => {
    if(p.term.length > 50 || p.def.length > 150) skipped.push(p);
    else valid.push(p);
  });
  rows = rows.filter(r => r.term.trim() || r.def.trim());
  rows = rows.concat(valid);
  document.getElementById('bulkText').value = '';
  renderRows();
  const skipCount = skipped.length + failedLines.length;
  if(skipCount > 0 && valid.length > 0){
    createNotification(`${valid.length} kotoba ditambahkan. ${skipCount} baris dilewati.`, 'info');
  } else if(valid.length === 0){
    createNotification('Tidak ada kotoba yang berhasil diproses.', 'error');
  } else {
    createNotification(`${valid.length} kotoba berhasil ditambahkan.`, 'success');
  }
}

// Load categories into select

async function handleSave(andPractice){
  const title = document.getElementById('title').value.trim();
  const desc = document.getElementById('desc').value.trim();
  const cleanTerms = rows
    .map(r => ({id: r.id, term: r.term.trim(), def: r.def.trim()}))
    .filter(r => r.term && r.def);

  if(!title){ createNotification('Judul set wajib diisi.', 'error'); return; }
  if(cleanTerms.length === 0 && !_pdfFile){ createNotification('Tambahkan minimal 1 kartu atau lampirkan file PDF.', 'error'); return; }

  const setId = editingId || uid('set');
  const now = Date.now();
  const termsWithMeta = cleanTerms.map(t => ({
    id: t.id, term: t.term, def: t.def,
    _review: t._review || { reps: 0, ease: 2.5, interval: 0, last: null, due: now }
  }));

  const set = { id: setId, title, desc, terms: termsWithMeta, updatedAt: now };
  if(_pdfFile) set.pdf = _pdfFile;

  const saveBtn = document.querySelector('.ibtn-primary');
  const origLabel = saveBtn ? saveBtn.textContent : '';
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Menyimpan...'; }

  try{
    _saving = true;
    await upsertSet(set);
    sessionStorage.setItem('navInternal','1');
    if(andPractice){
      navigateTo(cleanTerms.length > 0 ? `learn.html?id=${set.id}` : (set.pdf ? `pdf.html?id=${set.id}` : 'sets.html'));
    } else {
      navigateTo('sets.html');
    }
  }catch(e){
    _saving = false;
    if(_pdfFile && (e instanceof DOMException && (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED'))){
      createNotification('Penyimpanan penuh. PDF terlalu besar untuk perangkat ini.', 'error');
    } else {
      createNotification('Gagal menyimpan. Coba lagi.', 'error');
    }
    if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = origLabel; }
  }
}

// Init
(async function init(){
  if(!requireLogin()) return;

  function applyEditingSet(){
    if(!editingId) return;
    const set = getSet(editingId);
    if(set){
      document.getElementById('title').value = set.title;
      document.getElementById('desc').value = set.desc || '';
      rows = set.terms.map(t => ({id: t.id || uid('row'), term: t.term, def: t.def}));
      if(set.pdf) _pdfFile = set.pdf;
    }
  }
  applyEditingSet();
  renderPdfAttach();
  renderRows();
  if(rows.length === 0) addRow();
  const initialRows = JSON.stringify(rows);

  // Auto-resize desc
  const descEl = document.getElementById('desc');
  descEl.style.height = 'auto';
  descEl.style.height = Math.max(56, descEl.scrollHeight) + 'px';

  function hasUnsavedChanges(){
    if(_saving) return false;
    const title = document.getElementById('title').value.trim();
    return title || rows.some(r => r.term.trim() || r.def.trim()) || !!_pdfFile;
  }

  const leaveBtn = document.getElementById('leaveBtn');
  const leaveHandler = async (e) => {
    if(!hasUnsavedChanges()) return;
    e.preventDefault();
    const confirmed = await showConfirm('Perubahan belum disimpan. Keluar?', {confirmText:'Keluar', cancelText:'Batal'});
    if(confirmed) navigateTo('index.html');
  };
  leaveBtn.addEventListener('click', leaveHandler);
  window.__pageCleanup = () => {
    leaveBtn.removeEventListener('click', leaveHandler);
    document.removeEventListener('touchmove', onTouchMove);
    document.removeEventListener('touchend', onTouchEnd);
  };

  syncSetsFromServer().then(() => {
    if(editingId && JSON.stringify(rows) === initialRows){
      applyEditingSet();
      renderRows();
    }
  });
})();

Object.assign(window, {
  addRow, removeRow, handleSave, parseBulk,
  onFieldInput, onFieldKeydown, onTouchStart, onMouseDownStart
});
})();
</script>
</body>
