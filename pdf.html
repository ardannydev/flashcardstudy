<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Baca dokumen PDF langsung di dalam FlashCardStudy.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1426">
<title>Baca PDF — FlashCardStudy</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme pdf-page">

  <header class="nh nh-nav-always">
    <div class="nh-inner">
      <div class="nh-bar">
        <a href="sets.html" class="nh-logo">FlashCardStudy</a>
        <nav class="nh-nav-desktop">
          <div class="nh-skew-wrap">
            <a href="index.html" class="nh-link" draggable="false">Beranda</a>
            <a href="sets.html" class="nh-link active" draggable="false">Set</a>
            <a href="create.html" class="nh-link" draggable="false">Buat</a>
            <span class="nh-nav-dot" id="navDot"></span>
          </div>
        </nav>
        <div class="nh-actions">
          <a href="profile.html" class="nh-profile-btn" draggable="false" aria-label="Profil" id="navProfileBtn"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
        </div>
      </div>
    </div>
  </header>

  <main class="pdf-wrap">
    <div class="pdf-toolbar">
      <div class="pdf-toolbar-left">
        <a class="ibtn ibtn-outline" href="sets.html" draggable="false" id="pdfBackBtn">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Kembali
        </a>
        <div class="pdf-title-box">
          <h1 class="pdf-title" id="pdfTitle">Memuat...</h1>
          <span class="pdf-file-name" id="pdfFileName"></span>
        </div>
      </div>
      <div class="pdf-toolbar-right">
        <span class="pdf-page-indicator" id="pdfPageIndicator" hidden></span>
        <a class="ibtn ibtn-primary" href="#" id="pdfDownloadBtn" download draggable="false">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span class="pdf-btn-label">Unduh</span>
        </a>
      </div>
    </div>
    <div class="pdf-view" id="pdfView">
      <div class="pdf-loading">
        <div class="adm-spinner"></div>
        <span>Memuat dokumen...</span>
      </div>
    </div>
  </main>

<script src="app.js"></script>
<script type="module">
import { renderPdfViewer } from './pdf-viewer.js';

(async function(){
  if(!requireLogin()) return;

  const setId = qs('id');
  const view = document.getElementById('pdfView');
  const pageIndicator = document.getElementById('pdfPageIndicator');

  await syncSetsFromServer();
  const set = await getSetWithPdf(setId);

  if(!set || !set.pdf || !set.pdf.data){
    view.innerHTML = '<div class="pdf-error"><h2>PDF tidak ditemukan</h2><p>Dokumen ini mungkin sudah dihapus atau belum dilampirkan.</p><a class="ibtn ibtn-primary" href="sets.html">Kembali ke Set</a></div>';
    return;
  }

  document.title = set.title + ' — Baca PDF';
  document.getElementById('pdfTitle').textContent = set.title;
  document.getElementById('pdfFileName').textContent = set.pdf.name || 'Dokumen.pdf';

  try{
    const binary = atob(set.pdf.data);
    const bytes = new Uint8Array(binary.length);
    for(let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const blob = new Blob([bytes], { type: 'application/pdf' });
    const blobUrl = URL.createObjectURL(blob);

    const downloadBtn = document.getElementById('pdfDownloadBtn');
    downloadBtn.href = blobUrl;
    downloadBtn.download = set.pdf.name || 'dokumen.pdf';

    view.innerHTML = '<div class="pdf-loading"><div class="adm-spinner"></div><span>Menyiapkan halaman...</span></div>';

    await renderPdfViewer(view, bytes, {
      onReady(total){
        pageIndicator.hidden = false;
        pageIndicator.textContent = '1 / ' + total;
      },
      onScroll(current, total){
        pageIndicator.textContent = current + ' / ' + total;
      }
    });
  }catch(err){
    console.warn('Gagal memuat PDF:', err);
    view.innerHTML = '<div class="pdf-error"><h2>Gagal memuat PDF</h2><p>File mungkin rusak atau tidak didukung perangkat ini. Coba unduh file lalu buka di aplikasi PDF.</p><a class="ibtn ibtn-primary" href="sets.html">Kembali ke Set</a></div>';
  }
})();
</script>
</body>
</html>
